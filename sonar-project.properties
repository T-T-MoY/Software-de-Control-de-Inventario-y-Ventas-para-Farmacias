sonar.projectKey=farmacia-inventario
sonar.projectName=farmacia-inventario
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Código fuente
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/uploads/**,**/coverage/**,backend/tests/**

# Pruebas
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/tests/**/*.test.js

# Reporte de Cobertura (Frontend y Backend)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Exclusiones de Cobertura (Backend y Frontend)
sonar.coverage.exclusions=\
  **/routes/**,\
  backend/server.js,\
  backend/data/connection.js,\
  backend/config/env.js,\
  backend/presentation/middleware/medicine-photo-upload.js,\
  frontend/src/main.js,\
  frontend/src/presentation/router/**,\
  frontend/src/App.vue,\
  frontend/src/presentation/components/** /* (Opcional: excluye componentes visuales puros si no quieres testearlos)